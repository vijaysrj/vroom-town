<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vroom Town</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#8ED6FF;--sun:#FFCB2E;--cherry:#EF3B3B;--leaf:#3DBE5A;--ink:#22324A;--cream:#FFF8E6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;touch-action:none;overscroll-behavior:none;}
canvas{display:block;position:fixed;inset:0;}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;}
#hud.show{opacity:1;}
.score{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));display:flex;align-items:center;gap:6px;background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:0 20px 0 8px;box-shadow:0 5px 0 var(--ink);font-size:36px;font-weight:800;color:var(--ink);line-height:56px;}
.score svg{width:42px;height:42px;}
.score.pop{animation:pop .4s ease-out;}
@keyframes pop{40%{transform:scale(1.3) rotate(-6deg)}}
.topright{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:flex;gap:10px;pointer-events:auto;}
.swatches{display:flex;gap:10px;}
.swatch{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .15s;padding:0;}
.swatch.on{transform:translateY(-4px) scale(1.15);box-shadow:0 8px 0 var(--ink),0 0 0 4px #fff;}
.iconbtn{width:56px;height:56px;border-radius:18px;border:4px solid var(--ink);background:var(--cream);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;}
.iconbtn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink);}
.iconbtn svg{width:32px;height:32px;}

#wheelWrap{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:min(44vw,240px);aspect-ratio:1;pointer-events:auto;touch-action:none;}
#wheel{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(34,50,74,.55));will-change:transform;}
#horn{position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;border:none;background:transparent;cursor:pointer;}

#pedals{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:14px;pointer-events:auto;}
.pedal{border:5px solid var(–ink);border-radius:28px;box-shadow:0 7px 0 var(–ink);display:grid;place-items:center;cursor:pointer;touch-action:none;transition:transform .05s;padding:0;
background-image:repeating-linear-gradient(0deg,transparent 0 16px,rgba(0,0,0,.13) 16px 22px);}
.pedal.down{transform:translateY(7px);box-shadow:0 0 0 var(–ink);}
#gas{width:clamp(96px,22vw,130px);height:clamp(130px,30vw,175px);background-color:var(–leaf);}
#back{width:clamp(70px,16vw,90px);height:clamp(84px,19vw,108px);background-color:#B8C4D6;}
.pedal svg{width:55%;height:auto;}

#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(5vh + env(safe-area-inset-top)) 12px calc(6vh + env(safe-area-inset-bottom));
background:linear-gradient(to bottom,rgba(142,214,255,0) 45%,rgba(142,214,255,.6));transition:opacity .4s;}
.menu{display:flex;flex-direction:column;align-items:center;gap:14px;}
.vehicles{display:grid;grid-template-columns:repeat(6,auto);gap:10px;}
.vbtn{width:clamp(88px,27vw,100px);height:62px;border-radius:18px;border:4px solid var(–ink);background:var(–cream);box-shadow:0 5px 0 var(–ink);padding:3px 4px;cursor:pointer;transition:transform .12s;}
.vbtn svg{width:100%;height:100%;display:block;}
.vbtn.on{background:#fff;transform:translateY(-4px);box-shadow:0 9px 0 var(–ink),0 0 0 4px var(–sun);}
@media (max-width:640px){.vehicles{grid-template-columns:repeat(3,auto);}}
@media (max-width:440px){.swatch{width:36px;height:36px;border-width:3px;}.swatches{gap:7px;}}
#start.wait .vehicles,#start.wait .swatches{pointer-events:none;}
#start .swatches{background:rgba(255,248,230,.85);border:4px solid var(–ink);border-radius:999px;padding:8px 14px 12px;box-shadow:0 5px 0 var(–ink);}
#start.hide{opacity:0;pointer-events:none;}
#start h1{margin:0;font-size:clamp(56px,14vw,104px);font-weight:800;color:var(–sun);letter-spacing:.01em;line-height:.9;
-webkit-text-stroke:6px var(–ink);paint-order:stroke fill;text-shadow:0 8px 0 var(–ink);transform:rotate(-3deg);}
.times{display:flex;gap:clamp(12px,4vw,20px);}
.timebtn{width:clamp(86px,24vw,110px);aspect-ratio:1;border-radius:50%;border:6px solid var(–ink);box-shadow:0 9px 0 var(–ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit;line-height:.85;}
.timebtn:nth-child(1){background:var(–leaf);}
.timebtn:nth-child(2){background:var(–sun);}
.timebtn:nth-child(3){background:var(–cherry);}
.timebtn b{font-size:clamp(42px,12vw,54px);font-weight:800;color:var(–cream);-webkit-text-stroke:5px var(–ink);paint-order:stroke fill;}
.timebtn small{font-size:17px;font-weight:800;color:var(–ink);}
.timebtn:active{transform:translateY(9px);box-shadow:0 0 0 var(–ink);}
#start.wait .times{pointer-events:none;opacity:.5;}
#result{display:none;align-items:center;gap:10px;background:var(–cream);border:6px solid var(–ink);border-radius:999px;box-shadow:0 8px 0 var(–ink);padding:4px 34px 4px 14px;font-size:clamp(56px,15vw,80px);font-weight:800;color:var(–ink);line-height:1.1;animation:pop .6s ease-out;}
#result.show{display:flex;}
#result svg{width:1em;height:1em;}
.timer{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(–cream);border:4px solid var(–ink);border-radius:999px;padding:0 18px 0 10px;box-shadow:0 5px 0 var(–ink);font-size:30px;font-weight:800;color:var(–ink);line-height:56px;font-variant-numeric:tabular-nums;}
.timer svg{width:32px;height:32px;}
.timer.hurry{background:var(–cherry);color:var(–cream);animation:throb 1s ease-in-out infinite;}
.timer.hurry svg *{stroke:var(–cream);}
@keyframes throb{50%{transform:translateX(-50%) scale(1.12)}}
@media (max-width:520px){.timer{top:calc(80px + env(safe-area-inset-top));}}
@media (prefers-reduced-motion:reduce){.score.pop,.timer.hurry,#result{animation:none}}
button:focus-visible{outline:4px solid #fff;outline-offset:3px;}
</style>

</head>
<body>

<div id="hud">
  <div class="score" id="score">

  </div>

  <div class="timer" id="timer">

    <span id="clock">3:00</span>

  <div class="topright">
    <button class="iconbtn" id="home" aria-label="Go to the start page">

    </button>

    </button>
  </div>

  <div id="wheelWrap">
    <svg id="wheel" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="84" fill="none" stroke="#22324A" stroke-width="30"/>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#3A4A63" stroke-width="18"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#56688A" stroke-width="4" stroke-dasharray="60 470" stroke-dashoffset="40" stroke-linecap="round"/>
      <path d="M100 100 L28 116 M100 100 L172 116 M100 100 L100 178" stroke="#22324A" stroke-width="26" stroke-linecap="round"/>
      <path d="M100 100 L28 116 M100 100 L172 116 M100 100 L100 178" stroke="#3A4A63" stroke-width="14" stroke-linecap="round"/>
      <rect x="92" y="6" width="16" height="30" rx="6" fill="#EF3B3B" stroke="#22324A" stroke-width="4"/>
      <circle cx="100" cy="100" r="34" fill="#FFCB2E" stroke="#22324A" stroke-width="6"/>
      <path d="M82 92 h8 l14 -10 v36 l-14 -10 h-8 z" fill="#22324A"/>
      <path d="M110 92 q6 8 0 16 M115 86 q11 14 0 28" fill="none" stroke="#22324A" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <button id="horn" aria-label="Beep the horn"></button>
  </div>

  <div id="pedals">
    <button class="pedal" id="back" aria-label="Go backwards">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22324A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>
    <button class="pedal" id="gas" aria-label="Go">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22324A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </div>
</div>

<div id="start">
  <h1>Vroom Town</h1>
  <div class="menu">
  <div id="result" aria-live="polite">
    <svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1-5.3-4.9 7.1-.8z" fill="#FFCB2E" stroke="#22324A" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span id="resultCount">0</span>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="vehicles" id="vehicles">
      <button class="vbtn on" aria-label="Car"><svg viewBox="0 0 80 42"><path d="M8 33 L9 25 Q11 20 20 19 L29 12 Q32 10 37 10 L50 10 Q55 10 58 14 L63 19 Q72 20 73 26 L73 33 Z" fill="#E5262E" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><path d="M31 18 L36 13 L44 13 L44 18Z M47 18 L47 13 L54 13 L58 18Z" fill="#9FD8FF"/><circle cx="22" cy="34" r="6" fill="#22324A"/><circle cx="22" cy="34" r="2.7" fill="#C9CDD4"/><circle cx="60" cy="34" r="6" fill="#22324A"/><circle cx="60" cy="34" r="2.7" fill="#C9CDD4"/></svg></button>
      <button class="vbtn" aria-label="Fire truck"><svg viewBox="0 0 80 42"><rect x="4" y="13" width="48" height="21" rx="2" fill="#D7261E" stroke="#22324A" stroke-width="3"/><path d="M52 34 V9 H68 L76 20 V34 Z" fill="#D7261E" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><path d="M56 12 H66 L71 20 H56Z" fill="#9FD8FF"/><path d="M4 7 H48 M4 11 H48" stroke="#C9CDD4" stroke-width="2.5"/><path d="M10 7 V11 M18 7 V11 M26 7 V11 M34 7 V11 M42 7 V11" stroke="#C9CDD4" stroke-width="2"/><rect x="58" y="5" width="8" height="4" fill="#FF4050"/><rect x="4" y="22" width="48" height="2.5" fill="#fff"/><circle cx="15" cy="34" r="6" fill="#22324A"/><circle cx="15" cy="34" r="2.7" fill="#C9CDD4"/><circle cx="36" cy="34" r="6" fill="#22324A"/><circle cx="36" cy="34" r="2.7" fill="#C9CDD4"/><circle cx="66" cy="34" r="6" fill="#22324A"/><circle cx="66" cy="34" r="2.7" fill="#C9CDD4"/></svg></button>
      <button class="vbtn" aria-label="Race car"><svg viewBox="0 0 80 42"><path d="M4 33 L5 25 L22 23 L33 17 L47 17 L51 23 L76 28 L76 33 Z" fill="#FF7A1A" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><rect x="2" y="12" width="13" height="4" fill="#22324A"/><path d="M8 16 V24" stroke="#22324A" stroke-width="3"/><circle cx="40" cy="15" r="5" fill="#FFD43B" stroke="#22324A" stroke-width="2.5"/><circle cx="30" cy="27" r="4" fill="#fff"/><circle cx="17" cy="34" r="7" fill="#22324A"/><circle cx="17" cy="34" r="3.1" fill="#C9CDD4"/><circle cx="64" cy="34" r="6" fill="#22324A"/><circle cx="64" cy="34" r="2.7" fill="#C9CDD4"/></svg></button>
      <button class="vbtn" aria-label="School bus"><svg viewBox="0 0 80 42"><path d="M4 34 V9 Q4 6 7 6 H60 Q63 6 63 10 V19 H72 Q76 19 76 24 V34 Z" fill="#FFB703" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><path d="M9 10 H17 V17 H9Z M20 10 H28 V17 H20Z M31 10 H39 V17 H31Z M42 10 H50 V17 H42Z M53 10 H59 V17 H53Z" fill="#22324A"/><path d="M4 23 H76 M4 27 H76" stroke="#22324A" stroke-width="1.8"/><circle cx="18" cy="34" r="6" fill="#22324A"/><circle cx="18" cy="34" r="2.7" fill="#C9CDD4"/><circle cx="64" cy="34" r="6" fill="#22324A"/><circle cx="64" cy="34" r="2.7" fill="#C9CDD4"/></svg></button>
      <button class="vbtn" aria-label="Police car"><svg viewBox="0 0 80 42"><path d="M8 33 L9 25 Q11 20 20 19 L29 12 Q32 10 37 10 L50 10 Q55 10 58 14 L63 19 Q72 20 73 26 L73 33 Z" fill="#15171C" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><path d="M28 21 H58 V31 H28Z" fill="#fff"/><path d="M31 18 L36 13 L44 13 L44 18Z M47 18 L47 13 L54 13 L58 18Z" fill="#9FD8FF"/><rect x="36" y="4" width="7" height="5" rx="1" fill="#FF2030"/><rect x="43" y="4" width="7" height="5" rx="1" fill="#2060FF"/><circle cx="22" cy="34" r="6" fill="#22324A"/><circle cx="22" cy="34" r="2.7" fill="#C9CDD4"/><circle cx="60" cy="34" r="6" fill="#22324A"/><circle cx="60" cy="34" r="2.7" fill="#C9CDD4"/></svg></button>
      <button class="vbtn" aria-label="Very long car"><svg viewBox="0 0 80 42"><path d="M2 33 L2 27 Q3 24 8 24 L15 19 Q17 18 20 18 L66 18 Q69 18 71 21 L73 24 Q78 25 78 29 L78 33 Z" fill="#F2F2F2" stroke="#22324A" stroke-width="3" stroke-linejoin="round"/><path d="M18 23 L21 20 H30 V23Z M33 20 H43 V23 H33Z M46 20 H56 V23 H46Z M59 20 H67 L70 23 H59Z" fill="#22324A"/><circle cx="12" cy="34" r="5" fill="#22324A"/><circle cx="12" cy="34" r="2.2" fill="#C9CDD4"/><circle cx="68" cy="34" r="5" fill="#22324A"/><circle cx="68" cy="34" r="2.2" fill="#C9CDD4"/></svg></button>
  </div>
  <div class="times">
    <button class="timebtn" data-min="1" aria-label="Play for 1 minute"><b>1</b><small>min</small></button>
    <button class="timebtn" data-min="3" aria-label="Play for 3 minutes"><b>3</b><small>min</small></button>
    <button class="timebtn" data-min="5" aria-label="Play for 5 minutes"><b>5</b><small>min</small></button>
  </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
const col = h => new THREE.Color(h).convertSRGBToLinear();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const skyCol = col(0x8ED6FF);
scene.background = skyCol;
scene.fog = new THREE.Fog(skyCol, 90, 240);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);

/* environment map for shiny paint and glass */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const envGeo = new THREE.SphereGeometry(50, 48, 24);
{
  const cTop = col(0x4FAEF0), cHor = col(0xFFFFFF), cBot = col(0x4E7E33), cols = [];
  const p = envGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 50;
    const c = y > 0 ? cHor.clone().lerp(cTop, Math.pow(y, 0.5)) : cHor.clone().lerp(cBot, Math.min(1, -y * 4));
    cols.push(c.r, c.g, c.b);
  }
  envGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
}
envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
const envSun = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(10, 9.5, 8) }));
envSun.position.set(25, 30, 15);
envScene.add(envSun);
scene.environment = pmrem.fromScene(envScene, 0.02).texture;

/* lights */
scene.add(new THREE.HemisphereLight(col(0xD6F1FF), col(0x6A9A45), 0.5));
const sun = new THREE.DirectionalLight(col(0xFFF1D6), 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------- textures ---------- */
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#6FBF47'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(60,130,40,.35)' : 'rgba(170,220,110,.3)';
    g.fillRect(Math.random() * w, Math.random() * h, 2, 3);
  }
}, 70, 70);
const roadTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#41464F'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1800; i++) {
    const v = 50 + Math.random() * 40 | 0;
    g.fillStyle = `rgba(${v},${v},${v + 5},.5)`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
  }
  g.fillStyle = '#F4F4F0'; g.fillRect(5, 0, 5, h); g.fillRect(w - 10, 0, 5, h);
  g.fillStyle = '#FFCB2E'; g.fillRect(w / 2 - 3, 0, 6, h * 0.5);
}, 1, 1);

/* ---------- world ---------- */
const colliders = [];
/* track: two long straight roads joined by curves */
const ROAD_W = 11, TR = 45, TL = 140, TL2 = TL / 2, TRACK_LEN = 2 * TL + 2 * Math.PI * TR;
const WORLD_X = 175, WORLD_Z = 125;
function trackAt(s) {
  s = ((s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
  const arc = Math.PI * TR;
  if (s < arc) { const a = -Math.PI / 2 + s / TR; return { x: TL2 + TR * Math.cos(a), z: TR * Math.sin(a), tx: -Math.sin(a), tz: Math.cos(a) }; }
  s -= arc; if (s < TL) return { x: TL2 - s, z: TR, tx: -1, tz: 0 };
  s -= TL; if (s < arc) { const a = Math.PI / 2 + s / TR; return { x: -TL2 + TR * Math.cos(a), z: TR * Math.sin(a), tx: -Math.sin(a), tz: Math.cos(a) }; }
  s -= arc; return { x: -TL2 + s, z: -TR, tx: 1, tz: 0 };
}
/* position on the track, offset sideways (+ = outer side) */
function trackPoint(s, off) {
  const p = trackAt(s);
  return { x: p.x + p.tz * off, z: p.z - p.tx * off, tx: p.tx, tz: p.tz };
}
function trackDist(x, z) {
  const ax = Math.abs(x);
  return ax <= TL2 ? Math.abs(Math.abs(z) - TR) : Math.abs(Math.hypot(ax - TL2, z) - TR);
}
const TRACK_SAMPLES = [];
for (let s = 0; s < TRACK_LEN; s += 2) TRACK_SAMPLES.push(s);
function nearestS(x, z) {
  let best = 0, bd = Infinity;
  for (const s of TRACK_SAMPLES) { const p = trackAt(s), d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; best = s; } }
  return best;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function makeStrip(off, W, matOpts, y) {
  const pos = [], uv = [], idx = [], N = Math.ceil(TRACK_LEN / 1.2);
  for (let i = 0; i <= N; i++) {
    const s = i / N * TRACK_LEN, a = trackPoint(s, off - W / 2), b = trackPoint(s, off + W / 2), v = s / 9;

function makeWheel(side, r, w) {
  const pivot = new THREE.Group();
  const mirror = new THREE.Group(); if (side < 0) mirror.rotation.y = Math.PI;
  mirror.scale.set(r / 0.4, r / 0.4, w / 0.3);
  const spin = new THREE.Group();
  spin.add(new THREE.Mesh(tireGeo, tireMat));
  const sw = new THREE.Mesh(sidewallGeo, tireMat); sw.position.z = 0.13; spin.add(sw);
  const rf = new THREE.Mesh(rimFaceGeo, rimDark); rf.position.z = 0.12; spin.add(rf);
  const lip = new THREE.Mesh(rimLipGeo, rimMat); lip.position.z = 0.15; spin.add(lip);
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(spokeGeo, rimMat); s.position.z = 0.145; s.rotation.z = i / 5 * Math.PI; spin.add(s); }
  const hub = new THREE.Mesh(hubGeo, rimMat); hub.position.z = 0.17; spin.add(hub);
  spin.userData = { dir: side, r };
  mirror.add(spin); pivot.add(mirror);
  return { pivot, spin };
}

/* every vehicle: group > holder (centres it) > body + wheels */
function newVehicle(color, shiftX) {
  const group = new THREE.Group(), holder = new THREE.Group(), body = new THREE.Group();
  holder.position.x = shiftX; group.add(holder); holder.add(body);
  return { group, holder, body, paint: paintMat(color), front: [], spins: [], update: () => {} };
}
function addWheels(v, list) {
  list.forEach(([x, r, w, z, steer]) => {
    const wh = makeWheel(z < 0 ? -1 : 1, r, w);
    wh.pivot.position.set(x, r, z);
    v.holder.add(wh.pivot);
    if (steer) v.front.push(wh.pivot);
    v.spins.push(wh.spin);
  });
}
function finish(v, o) {
  Object.assign(v, o);
  v.group.traverse(m => { if (m.isMesh) m.castShadow = true; });
  const span = v.len - 2 * v.halfW, n = Math.max(1, Math.ceil(span / (v.halfW * 1.2)));
  v.offsets = []; for (let i = 0; i <= n; i++) v.offsets.push(-v.len / 2 + v.halfW + span * i / n);
  scene.add(v.group);
  return v;
}

  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);

  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
}

    f.type = 'lowpass'; f.frequency.value = 2200; g.gain.value = 0;

}

const fwd = new THREE.Vector3(), camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3();

/* world-space collision circles along a vehicle's length */
function circles(v, x, z, h) {
  const c = Math.cos(h), s = -Math.sin(h);
  return v.offsets.map(o => [x + c * o, z + s * o]);
}

function step(dt) {
  t += dt;
  if (started) { timeLeft -= dt; showClock(); if (timeLeft <= 0) endGame(); }

  /* steering */
  const ks = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (!wheelTouch) wheelAngle += (ks * MAX_WHEEL - wheelAngle) * Math.min(1, dt * (ks ? 2.5 : 5));
  wheelEl.style.transform = `rotate(${wheelAngle}deg)`;
  const raw = clamp(wheelAngle / MAX_WHEEL, -1, 1);
  const steer = Math.sign(raw) * Math.pow(Math.abs(raw), 1.6);
  P.steer += (steer - P.steer) * Math.min(1, dt * 5);

  /* speed: cruises by itself, gas speeds up */
  const gas = started && (input.gas || keys.ArrowUp || keys.KeyW);
  const back = started && (input.back || keys.ArrowDown || keys.KeyS);
  const onRoad = trackDist(P.x, P.z) < ROAD_W / 2 + 0.8;
  const maxF = onRoad ? vdef.top : vdef.top * 0.65;
  const cruise = onRoad ? vdef.cruise : vdef.cruise * 0.75;
  if (back) P.speed -= (P.speed > 0 ? 18 : 6) * dt;
  else {
    const target = !started ? 0 : gas ? maxF : cruise;
    const acc = P.speed < 0 ? 14 : gas ? vdef.top * 0.5 : 5;
    if (P.speed < target) P.speed = Math.min(target, P.speed + acc * dt);
    else P.speed = Math.max(target, P.speed - 6 * dt);
  }
  P.speed = clamp(P.speed, -6, 26);

  /* turn around the rear axle so long vehicles track naturally */
  const grip = Math.min(1, Math.abs(P.speed) / 4) * Math.sign(P.speed);
  const ro = player.rearOff;
  const rx = P.x - Math.cos(P.h) * ro, rz = P.z + Math.sin(P.h) * ro;
  P.h -= P.steer * player.turn * grip * dt;
  P.x = rx + Math.cos(P.h) * ro; P.z = rz - Math.sin(P.h) * ro;
  fwd.set(Math.cos(P.h), 0, -Math.sin(P.h));
  P.x += fwd.x * P.speed * dt; P.z += fwd.z * P.speed * dt;

  /* collisions */
  let hit = false;
  const pushOut = (cx, cz, ox, oz, min) => {
    const dx = cx - ox, dz = cz - oz, d = Math.hypot(dx, dz);
    if (d < min && d > 0.001) { P.x += dx / d * (min - d); P.z += dz / d * (min - d); hit = true; }
  };
  for (const [cx, cz] of circles(player, P.x, P.z, P.h))
    for (const c of colliders) pushOut(cx, cz, c.x, c.z, c.r + player.halfW + 0.2);
  for (const tr of traffic) {
    const tp = tr.v.group.position, th = tr.v.group.rotation.y;
    if (Math.hypot(tp.x - P.x, tp.z - P.z) > (tr.v.len + player.len) / 2 + 2) continue;
    const tc = circles(tr.v, tp.x, tp.z, th);
    for (const [cx, cz] of circles(player, P.x, P.z, P.h))
      for (const [ox, oz] of tc) pushOut(cx, cz, ox, oz, player.halfW + tr.v.halfW + 0.2);
  }
  if (hit) { if (Math.abs(P.speed) > 3) bump(); P.speed *= -0.25; }
  if (Math.abs(P.x) > WORLD_X || Math.abs(P.z) > WORLD_Z) {
    P.x = clamp(P.x, -WORLD_X, WORLD_X); P.z = clamp(P.z, -WORLD_Z, WORLD_Z); P.speed *= 0.5;
  }

  /* apply to vehicle */
  player.group.position.set(P.x, 0, P.z); player.group.rotation.y = P.h;
  player.front.forEach(w => w.rotation.y = -P.steer * 0.5);
  player.spins.forEach(s => s.rotation.z -= s.userData.dir * P.speed * dt / s.userData.r);
  const accel = gas ? 1 : back ? -1 : 0;
  player.body.rotation.x += ((-P.steer * Math.abs(P.speed) / 17) * 0.05 - player.body.rotation.x) * Math.min(1, dt * 6);
  player.body.rotation.z += ((accel * 0.015) - player.body.rotation.z) * Math.min(1, dt * 4);
  player.update(t);

  /* traffic */
  for (const tr of traffic) {
    const p = tr.v.group.position;
    const tp = trackPoint(tr.s, tr.off), tx = tp.tx * tr.dir, tz = tp.tz * tr.dir;
    const dx = P.x - p.x, dz = P.z - p.z, ahead = dx * tx + dz * tz, side = Math.abs(dx * tz - dz * tx);
    const blocked = ahead > 0 && ahead < (tr.v.len + player.len) / 2 + 4 && side < tr.v.halfW + player.halfW + 0.8;
    tr.speed += ((blocked ? 0 : tr.base) - tr.speed) * Math.min(1, dt * (blocked ? 5 : 1));
    tr.s += tr.dir * tr.speed * dt;
    const np = trackPoint(tr.s, tr.off);
    p.set(np.x, 0, np.z);
    tr.v.group.rotation.y = Math.atan2(-np.tz * tr.dir, np.tx * tr.dir);
    tr.v.spins.forEach(s => s.rotation.z -= s.userData.dir * tr.speed * dt / s.userData.r);
    tr.v.update(t);
  }

  /* stars */
  const pc = circles(player, P.x, P.z, P.h);
  for (const s of stars) {
    if (!s.visible) { s.userData.wait -= dt; if (s.userData.wait <= 0) placeStar(s); continue; }
    s.rotation.y += dt * 2.2;
    s.position.y = 1.5 + Math.sin(t * 2.5 + s.userData.phase) * 0.25;
    if (started && pc.some(([cx, cz]) => Math.hypot(s.position.x - cx, s.position.z - cz) < player.halfW + 1.3)) {
      s.visible = false; s.userData.wait = 5;
      score++; countEl.textContent = score;
      scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
      const big = score % 10 === 0;
      burst(s.position, big ? 120 : 35); chime(big);
    }
  }
  for (const m of confetti) {
    if (!m.visible) continue;
    const u = m.userData; u.life -= dt;
    if (u.life <= 0 || m.position.y < 0) { m.visible = false; continue; }
    u.v.y -= 14 * dt; u.v.multiplyScalar(1 - dt * 0.8);
    m.position.addScaledVector(u.v, dt);
    m.rotation.x += u.rs.x * dt; m.rotation.y += u.rs.y * dt; m.rotation.z += u.rs.z * dt;
  }
  ducks.forEach(d => {
    const u = d.userData; u.a += u.sp * dt;
    d.position.set(Math.cos(u.a) * u.r, 0.02 + Math.sin(t * 3 + u.r) * 0.04, Math.sin(u.a) * u.r);
    d.rotation.y = -u.a - Math.PI;
  });

  /* engine sound */
  if (eng) {
    const sp = Math.abs(P.speed), now = actx.currentTime, k = vdef.eng;
    eng.o1.frequency.setTargetAtTime((42 + sp * 5.5) * k, now, 0.08);
    eng.o2.frequency.setTargetAtTime((21 + sp * 2.75) * k, now, 0.08);
    eng.f.frequency.setTargetAtTime((300 + sp * 40) * Math.sqrt(k), now, 0.1);
    eng.g.gain.setTargetAtTime(0.035 + sp / vdef.top * 0.05, now, 0.1);
  }

  /* camera */
  const L = player.len, H = player.height;
  if (!started) {
    orbit += dt * 0.35;
    const r = L * 0.85 + 5;
    camTarget.set(P.x + Math.cos(orbit) * r, H + 1.6, P.z + Math.sin(orbit) * r);
    camera.position.lerp(camTarget, 1 - Math.exp(-3 * dt));
    lookTarget.set(P.x, H * 0.2 - 1.2, P.z);
  } else {
    const back_ = L * 0.6 + 6.5;
    camTarget.set(P.x - fwd.x * back_, H + 2.6 + L * 0.22, P.z - fwd.z * back_);
    camera.position.lerp(camTarget, 1 - Math.exp(-4 * dt));
    lookTarget.set(P.x + fwd.x * (2 + L * 0.35), H * 0.55, P.z + fwd.z * (2 + L * 0.35));
  }
  camera.lookAt(lookTarget);
  sun.position.set(P.x + 30, 50, P.z + 20);
  sun.target.position.set(P.x, 0, P.z);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>

</body>
</html>
